<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowers</title>
<style>
  html, body{
    margin: 0;
    height: 100%;
    background: #030711;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .frame{
    width: min(96vw, 520px);
    aspect-ratio: 480 / 640;
    position: relative;
  }
  svg{ width: 100%; height: 100%; display: block; touch-action: manipulation; }

  .caption{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-size: 14px;
    letter-spacing: 0.16em;
    fill: #dbe9ff;
    opacity: 0.5;
  }
  .hint{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    fill: #dbe9ff;
    opacity: 0.4;
    font-style: italic;
  }

  .flower-inner{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: no-preference){
    .flower-inner.poke{
      animation: poke 0.75s cubic-bezier(.25,1.6,.4,1);
    }
    .field-sway{
      animation: fieldSway 9s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }
    .twinkle{ animation: tw 4s ease-in-out infinite; }
    .drift{ animation: drift linear infinite; }
    .moon-pulse{ animation: moonPulse 6s ease-in-out infinite; }
  }

  @keyframes poke{
    0%   { transform: rotate(0deg) scale(1); }
    25%  { transform: rotate(calc(var(--dir,1) * 11deg)) scale(1.06); }
    50%  { transform: rotate(calc(var(--dir,1) * -5deg)) scale(0.97); }
    72%  { transform: rotate(calc(var(--dir,1) * 2.5deg)) scale(1.015); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes fieldSway{
    0%, 100% { transform: rotate(-0.6deg); }
    50% { transform: rotate(0.6deg); }
  }
  @keyframes tw{
    0%, 100% { opacity: 0.25; }
    50% { opacity: 1; }
  }
  @keyframes drift{
    from { transform: translateY(0); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.5; }
    to   { transform: translateY(-160px); opacity: 0; }
  }
  @keyframes moonPulse{
    0%, 100% { opacity: 0.9; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="frame">
<svg id="scene" viewBox="0 0 480 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020509"/>
      <stop offset="55%" stop-color="#071a33"/>
      <stop offset="100%" stop-color="#123356"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#dbeeff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#dbeeff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#183a52"/>
      <stop offset="100%" stop-color="#0c2436"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134a3a"/>
      <stop offset="100%" stop-color="#092b21"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e3a2a"/>
      <stop offset="100%" stop-color="#041712"/>
    </linearGradient>

    <radialGradient id="petalPale" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cfe8ff"/>
      <stop offset="100%" stop-color="#6fa8e0"/>
    </radialGradient>
    <radialGradient id="petalDeep" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f4faff"/>
      <stop offset="42%" stop-color="#9dc8f2"/>
      <stop offset="100%" stop-color="#3d6fb0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd9a0"/>
      <stop offset="100%" stop-color="#1f5c3d"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5bb883"/>
      <stop offset="100%" stop-color="#1c4b34"/>
    </linearGradient>

    <filter id="blurSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blurWide" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurMoon" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <g id="bloomPale">
      <circle r="34" fill="url(#coreGlow)" filter="url(#blurSoft)" opacity="0.75"/>
      <g>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalPale)" transform="rotate(0)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalPale)" transform="rotate(72)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalPale)" transform="rotate(144)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalPale)" transform="rotate(216)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalPale)" transform="rotate(288)"/>
      </g>
      <circle r="7.5" fill="#ffffff"/>
      <circle r="2.6" fill="#eaf6ff" filter="url(#blurSoft)"/>
    </g>

    <g id="bloomDeep">
      <circle r="34" fill="url(#coreGlow)" filter="url(#blurSoft)" opacity="0.8"/>
      <g>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalDeep)" transform="rotate(15)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalDeep)" transform="rotate(87)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalDeep)" transform="rotate(159)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalDeep)" transform="rotate(231)"/>
        <path d="M0,0 C-11,-14 -11,-30 0,-40 C11,-30 11,-14 0,0 Z" fill="url(#petalDeep)" transform="rotate(303)"/>
      </g>
      <circle r="7.5" fill="#ffffff"/>
      <circle r="2.6" fill="#eaf6ff" filter="url(#blurSoft)"/>
    </g>
  </defs>

  
  <rect width="480" height="640" fill="url(#sky)"/>

  
  <g class="moon-pulse">
    <circle cx="360" cy="90" r="70" fill="url(#moonGlow)" filter="url(#blurMoon)"/>
    <circle cx="360" cy="90" r="26" fill="#f7fbff"/>
  </g>

  
  <g class="twinkle">
    <circle cx="60" cy="70" r="1.6" fill="#ffffff"/>
    <circle cx="150" cy="40" r="1.3" fill="#dbe9ff"/>
    <circle cx="230" cy="110" r="1.8" fill="#ffffff"/>
    <circle cx="420" cy="180" r="1.4" fill="#dbe9ff"/>
  </g>
  <g class="twinkle" style="animation-delay:1.3s">
    <circle cx="100" cy="150" r="1.4" fill="#dbe9ff"/>
    <circle cx="300" cy="55" r="1.6" fill="#ffffff"/>
    <circle cx="40" cy="220" r="1.3" fill="#dbe9ff"/>
  </g>
  <g class="twinkle" style="animation-delay:2.4s">
    <circle cx="200" cy="180" r="1.3" fill="#ffffff"/>
    <circle cx="440" cy="90" r="1.6" fill="#dbe9ff"/>
    <circle cx="280" cy="220" r="1.2" fill="#ffffff"/>
  </g>

  
  <rect x="0" y="300" width="480" height="90" fill="#0c2436" opacity="0.5" filter="url(#blurWide)"/>

  
  <path d="M0,360 C90,320 160,340 240,330 C320,320 400,345 480,325 L480,640 L0,640 Z" fill="url(#hillBack)"/>
  <path d="M0,430 C100,395 190,420 260,400 C340,378 420,410 480,390 L480,640 L0,640 Z" fill="url(#hillMid)"/>
  <path d="M0,520 C110,480 200,510 280,485 C360,462 430,500 480,478 L480,640 L0,640 Z" fill="url(#hillFront)"/>

  
  <g id="field" class="field-sway"></g>

  
  <g id="pollen"></g>

  <text x="240" y="616" text-anchor="middle" class="caption"></text>
  <text x="240" y="632" text-anchor="middle" class="hint"></text>
</svg>
</div>

<script>
(function(){
  const svgNS = "http://www.w3.org/2000/svg";
  const field = document.getElementById('field');
  const pollen = document.getElementById('pollen');

  function rand(min, max){ return min + Math.random() * (max - min); }
  function choice(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  function makeFlower(x, y, scale, bloomId, interactive){
    const outer = document.createElementNS(svgNS, 'g');
    outer.setAttribute('style', `transform: translate(${x}px, ${y}px) scale(${scale});`);

    const hit = document.createElementNS(svgNS, 'circle');
    hit.setAttribute('cx', '0');
    hit.setAttribute('cy', '-20');
    hit.setAttribute('r', '34');
    hit.setAttribute('fill', 'transparent');
    if (interactive) hit.setAttribute('style', 'cursor:pointer;');
    outer.appendChild(hit);

    const inner = document.createElementNS(svgNS, 'g');
    inner.setAttribute('class', 'flower-inner');

    const stemLen = rand(58, 78);
    const sway = choice([-10, -6, 6, 10]);
    const stem = document.createElementNS(svgNS, 'path');
    stem.setAttribute('d', `M0,0 C${sway * 0.3},${-stemLen * 0.4} ${sway},${-stemLen * 0.75} 0,${-stemLen}`);
    stem.setAttribute('stroke', 'url(#stemGrad)');
    stem.setAttribute('stroke-width', '3.4');
    stem.setAttribute('fill', 'none');
    stem.setAttribute('stroke-linecap', 'round');
    inner.appendChild(stem);

    for(let i = 0; i < 2; i++){
      const ly = -stemLen * rand(0.35, 0.6);
      const dir = i === 0 ? 1 : -1;
      const leaf = document.createElementNS(svgNS, 'path');
      leaf.setAttribute('d', `M0,${ly} C${dir*22},${ly-6} ${dir*30},${ly+4} ${dir*10},${ly+14} C${dir*4},${ly+8} 0,${ly+2} 0,${ly} Z`);
      leaf.setAttribute('fill', 'url(#leafGrad)');
      inner.appendChild(leaf);
    }

    const bloom = document.createElementNS(svgNS, 'use');
    bloom.setAttribute('href', '#' + bloomId);
    bloom.setAttribute('x', 0);
    bloom.setAttribute('y', -stemLen);
    inner.appendChild(bloom);

    outer.appendChild(inner);

    if (interactive){
      const trigger = () => {
        inner.style.setProperty('--dir', Math.random() < 0.5 ? '1' : '-1');
        inner.classList.remove('poke');
        void inner.offsetWidth;
        inner.classList.add('poke');
      };
      hit.addEventListener('pointerdown', trigger);
      inner.addEventListener('pointerdown', trigger);
      inner.addEventListener('animationend', () => inner.classList.remove('poke'));
    }

    return outer;
  }

  const farCount = 11;
  for(let i = 0; i < farCount; i++){
    const x = rand(10, 470);
    const y = rand(345, 385);
    const scale = rand(0.32, 0.46);
    const g = makeFlower(x, y, scale, choice(['bloomPale','bloomDeep']), true);
    g.style.opacity = 0.55;
    field.appendChild(g);
  }

  const midCount = 13;
  for(let i = 0; i < midCount; i++){
    const x = rand(0, 480);
    const y = rand(415, 470);
    const scale = rand(0.55, 0.8);
    const g = makeFlower(x, y, scale, choice(['bloomPale','bloomDeep']), true);
    g.style.opacity = 0.85;
    field.appendChild(g);
  }

  const frontCount = 16;
  for(let i = 0; i < frontCount; i++){
    const x = rand(-5, 485);
    const y = rand(495, 585);
    const scale = rand(0.85, 1.25);
    const g = makeFlower(x, y, scale, choice(['bloomPale','bloomDeep']), true);
    g.style.opacity = 1;
    field.appendChild(g);
  }

  const flowers = Array.from(field.children);
  flowers.sort((a, b) => {
    const ay = parseFloat(a.style.transform.match(/translate\([^,]+,\s*([-\d.]+)px\)/)[1]);
    const by = parseFloat(b.style.transform.match(/translate\([^,]+,\s*([-\d.]+)px\)/)[1]);
    return ay - by;
  });
  flowers.forEach(f => field.appendChild(f));

  for(let i = 0; i < 16; i++){
    const dot = document.createElementNS(svgNS, 'circle');
    const x = rand(20, 460);
    const y = rand(380, 600);
    const r = rand(1, 2.4);
    dot.setAttribute('cx', x);
    dot.setAttribute('cy', y);
    dot.setAttribute('r', r);
    dot.setAttribute('fill', Math.random() < 0.5 ? '#ffffff' : '#bfe0c9');
    dot.setAttribute('opacity', '0.7');
    dot.setAttribute('class', 'drift');
    dot.style.animationDuration = rand(5, 10) + 's';
    dot.style.animationDelay = rand(0, 6) + 's';
    pollen.appendChild(dot);
  }
})();
</script>
</body>
</html>
